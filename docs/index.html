<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR | رستوران</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d0d0c;color:#f6f1e7;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;background:#0d0d0cee;border-bottom:1px solid #333}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.2em}.hero{min-height:65vh;display:grid;place-items:center;text-align:center}.hero h1{font-size:clamp(50px,9vw,105px)}.section{padding:60px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#171715;border:1px solid #333;border-radius:18px;padding:20px}.food{overflow:hidden;padding:0}.food img{width:100%;height:210px;object-fit:cover}.body{padding:18px}.muted{color:#9b9588}.price{color:#d6b978;font-weight:800}.btn{border:1px solid #d6b978;background:#d6b978;color:#17130a;padding:11px 17px;border-radius:10px;font-weight:800}.alt{background:transparent;color:#f6f1e7}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#9b9588}input,textarea,select{background:#0e0e0d;color:#f6f1e7;border:1px solid #333;padding:11px;border-radius:9px}.two{grid-template-columns:1fr 1fr}.admin{display:none;padding:45px 0}.admin.on{display:block}.hide{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #333;text-align:right}@media(max-width:800px){.grid,.two{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const db=window.supabase.createClient("https://tvoeeeggjypptlblyuyr.supabase.co","sb_publishable_JD0HVLOqpZSKnU4IKYOy9w_rOhjQAVw",{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));let S={};
async function load(){const q=await Promise.all([db.from("restaurant_settings").select("*").single(),db.from("theme_settings").select("*").single(),db.from("menu_categories").select("*").eq("is_active",true).is("deleted_at",null).order("sort_order"),db.from("menu_items").select("*,media:media(*)").is("deleted_at",null).order("sort_order"),db.from("special_offers").select("*,media:media(*)").eq("is_active",true).lte("starts_at",new Date().toISOString()).gte("ends_at",new Date().toISOString()),db.from("media").select("*").is("deleted_at",null).order("created_at",{ascending:false})]);S={settings:q[0].data||{},theme:q[1].data||{},cats:q[2].data||[],items:q[3].data||[],offers:q[4].data||[],media:q[5].data||[]};render()}
function render(){const s=S.settings,t=S.theme;document.documentElement.style.setProperty("--gold",t.primary_color||"#d6b978");const food=S.cats.map(c=>"<h3 style='color:#d6b978'>"+esc(c.name)+"</h3><div class='grid'>"+S.items.filter(i=>i.category_id===c.id&&i.is_available).map(i=>"<article class='card food'>"+(i.media?.public_url?"<img src='"+esc(i.media.public_url)+"'>":"")+"<div class='body'><h3>"+esc(i.name)+"</h3><p class='muted'>"+esc(i.description||"")+"</p><span class='price'>"+esc(i.price)+" "+esc(s.currency_symbol||"﷼")+"</span></div></article>").join("")+"</div>").join("");$("#app").innerHTML="<div id='public'><header class='top'><div class='wrap'><div class='nav'><a class='brand'>NOIR</a><div><a href='#menu'>منو</a>　<a href='#reserve'>رزرو</a>　<button class='btn alt' onclick='admin()'>مدیریت</button></div></div></div></header><main><section class='hero'><div class='wrap'><small style='color:#d6b978'>"+esc(s.tagline_en||"TASTE BEYOND EXPECTATION")+"</small><h1>"+esc(s.name_en||"NOIR")+"</h1><p class='muted'>"+esc(s.description||"یک تجربه لوکس و دقیق از طعم و مهمان‌نوازی.")+"</p></div></section><section id='menu' class='section'><div class='wrap'><h2>منو</h2>"+food+"</div></section>"+(S.offers.length?"<section class='section'><div class='wrap'><h2>پیشنهاد ویژه</h2><div class='grid'>"+S.offers.map(o=>"<div class='card'><h3>"+esc(o.title)+"</h3><p class='muted'>"+esc(o.description)+"</p><span class='price'>"+esc(o.new_price||"")+" "+esc(s.currency_symbol||"﷼")+"</span></div>").join("")+"</div></div></section>":"")+"<section id='reserve' class='section'><div class='wrap'><div class='card'><h2>رزرو میز</h2><form class='form two' onsubmit='reserve(event)'><label>نام<input name='name' required></label><label>تلفن<input name='phone' required></label><label>تاریخ و ساعت<input name='reservation_at' type='datetime-local' required></label><label>تعداد نفرات<input name='party_size' type='number' min='1' max='50' value='2'></label><label style='grid-column:1/-1'>توضیحات<textarea name='notes'></textarea></label><button class='btn'>ثبت رزرو</button></form><div id='msg'></div></div></div></section></main></div><div id='admin' class='admin'></div>"}
async function reserve(e){e.preventDefault();const f=new FormData(e.target),{error}=await db.from("reservations").insert({name:f.get("name"),phone:f.get("phone"),reservation_at:new Date(f.get("reservation_at")).toISOString(),party_size:Number(f.get("party_size")),notes:f.get("notes")||""});$("#msg").textContent=error?"ثبت رزرو انجام نشد.":"درخواست رزرو ثبت شد.";if(!error)e.target.reset();db.from("analytics_events").insert({event_type:"reservation_submit"})}
function admin(){location.hash="admin";$("#public").classList.add("hide");$("#admin").classList.add("on");login()}
async function login(){const {data:{session}}=await db.auth.getSession();if(session){const {data:r}=await db.from("user_roles").select("role").eq("user_id",session.user.id).maybeSingle();if(r?.role){panel(r.role);return}}$("#admin").innerHTML="<div class='wrap'><div class='card'><h2>ورود مدیریت</h2><form class='form' onsubmit='signin(event)'><label>ایمیل<input name='email' type='email' required></label><label>رمز عبور<input name='password' type='password' required></label><button class='btn'>ورود</button></form><div id='loginmsg'></div><button class='btn alt' onclick='closeAdmin()'>بازگشت</button></div></div>"}
async function signin(e){e.preventDefault();const f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){$("#loginmsg").textContent="ورود ناموفق بود.";return}login()}
function closeAdmin(){location.hash="";$("#admin").classList.remove("on");$("#public").classList.remove("hide")}
async function panel(role){const [c,i,r]=await Promise.all([db.from("menu_categories").select("*").is("deleted_at",null).order("sort_order"),db.from("menu_items").select("*").is("deleted_at",null).order("sort_order"),db.from("reservations").select("*").order("reservation_at",{ascending:true}).limit(50)]);$("#admin").innerHTML="<div class='wrap'><div class='toolbar'><div><small style='color:#d6b978'>NOIR · CONTROL</small><h1>پنل مدیریت</h1><span class='muted'>"+esc(role)+"</span></div><button class='btn alt' onclick='closeAdmin()'>سایت</button></div><div class='grid'><div class='card'><h2>"+i.data.length+"</h2><span class='muted'>غذا</span></div><div class='card'><h2>"+c.data.length+"</h2><span class='muted'>دسته</span></div><div class='card'><h2>"+r.data.filter(x=>x.status==="pending").length+"</h2><span class='muted'>رزرو در انتظار</span></div></div><section class='section'><div class='card'><h2>افزودن غذا</h2><form class='form two' onsubmit='addItem(event)'><label>دسته<select name='category_id'>"+c.data.map(x=>"<option value='"+x.id+"'>"+esc(x.name)+"</option>").join("")+"</select></label><label>نام<input name='name' required></label><label>قیمت<input name='price' type='number' min='0' required></label><label style='grid-column:1/-1'>توضیح<textarea name='description'></textarea></label><button class='btn'>افزودن</button></form></div></section><section class='section'><div class='card'><h2>رزروها</h2><table class='table'><tr><th>مشتری</th><th>زمان</th><th>نفر</th><th>وضعیت</th></tr>"+r.data.map(x=>"<tr><td>"+esc(x.name)+"<br>"+esc(x.phone)+"</td><td>"+new Date(x.reservation_at).toLocaleString("fa-IR")+"</td><td>"+x.party_size+"</td><td><select onchange='status(\""+x.id+"\",this.value)'><option "+(x.status==="pending"?"selected":"")+" value='pending'>در انتظار</option><option "+(x.status==="confirmed"?"selected":"")+" value='confirmed'>تأیید</option><option "+(x.status==="completed"?"selected":"")+" value='completed'>تکمیل</option><option "+(x.status==="cancelled"?"selected":"")+" value='cancelled'>لغو</option></select></td></tr>").join("")+"</table></div></section><button class='btn' onclick='logout()'>خروج</button></div>"}
async function addItem(e){e.preventDefault();const f=new FormData(e.target),{error}=await db.from("menu_items").insert({category_id:f.get("category_id"),name:f.get("name"),price:Number(f.get("price")),description:f.get("description")||"",is_available:true,sort_order:100});if(error)alert(error.message);else{await load();login()}}
async function status(id,status){const {error}=await db.from("reservations").update({status}).eq("id",id);if(error)alert(error.message)}
async function logout(){await db.auth.signOut();closeAdmin()}
load();if(location.hash==="admin")setTimeout(admin,300);
</script></body></html>
